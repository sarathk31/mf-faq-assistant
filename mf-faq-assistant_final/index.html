<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scheme Facts · Mutual fund FAQ</title>
<meta name="description" content="Facts-only answers about four HDFC Mutual Fund schemes, each with one official source link.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* ---------- Tokens (light / dark) ---------- */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#f8fafb; --ink:#1b1f26; --ink-2:#4f5663; --ink-3:#868d99; --line:#e6e9ee;
  --brand:#00a87e; --brand-ink:#ffffff; --brand-soft:#e3f6f0; --brand-strong:#00805f;
  --red:#d6453d; --red-soft:#fdeceb; --amber:#b7791f; --amber-soft:#fdf3e1; --blue:#3a64d8; --blue-soft:#eaf0fd;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.06);
  --shadow-lg:0 12px 36px rgba(16,24,40,.16);
  --radius:16px; --font:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1113; --surface:#161a1e; --surface-2:#1b2025; --ink:#eef1f4; --ink-2:#b4bbc5; --ink-3:#7d8590; --line:#252b32;
  --brand:#25c497; --brand-ink:#03140e; --brand-soft:#11302a; --brand-strong:#52dab5;
  --red:#f07b73; --red-soft:#3a1f1d; --amber:#e8b25e; --amber-soft:#33281a; --blue:#8aa7f5; --blue-soft:#1e2742;
  --shadow:none; --shadow-lg:0 12px 36px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1113; --surface:#161a1e; --surface-2:#1b2025; --ink:#eef1f4; --ink-2:#b4bbc5; --ink-3:#7d8590; --line:#252b32;
  --brand:#25c497; --brand-ink:#03140e; --brand-soft:#11302a; --brand-strong:#52dab5;
  --red:#f07b73; --red-soft:#3a1f1d; --amber:#e8b25e; --amber-soft:#33281a; --blue:#8aa7f5; --blue-soft:#1e2742;
  --shadow:none; --shadow-lg:0 12px 36px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand-strong);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap;color:var(--ink)}
.logo:hover{text-decoration:none}
.logo .mark{width:32px;height:32px;border-radius:50%;background:conic-gradient(from 200deg,var(--brand),#5b8def,var(--brand));display:grid;place-items:center}
.logo .mark svg{width:16px;height:16px}
.nav{display:flex;gap:4px}
.nav a{padding:7px 12px;border-radius:8px;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.nav a:hover{text-decoration:none;background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.search{position:relative;flex:1;max-width:440px;margin-left:auto}
.search .box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 10px 0 12px;transition:border-color .15s,box-shadow .15s}
.search .box:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:9px 0;outline:none}
.search svg{width:16px;height:16px;color:var(--ink-3)}
.kbd{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:none;z-index:5}
.results.on{display:block;animation:pop .14s ease-out}
.results button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;font-size:14px}
.results button[aria-selected="true"],.results button:hover{background:var(--surface-2)}
.results .mini{width:28px;height:28px;border-radius:8px;font-size:11px}
.results small{color:var(--ink-3);display:block;font-size:12px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto}
.iconbtn:hover{color:var(--ink);background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}
@media (max-width:980px){.nav{display:none}}
@media (max-width:640px){
  .topbar .in{flex-wrap:wrap;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .theme{margin-left:auto}
  .kbd{display:none}
}

/* ---------- Layout ---------- */
.page{max-width:1280px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
@media (max-width:1080px){.page{grid-template-columns:1fr}}
.view{animation:viewin .22s ease-out}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 12px;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:0 0 18px;max-width:640px}
section.block{margin-top:30px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sechead span{font-size:13px;color:var(--ink-3)}

/* Category tiles */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:transform .15s,border-color .15s,box-shadow .15s}
.cat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cat[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.cat .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.cat .ic svg{width:20px;height:20px}
.cat b{font-size:14.5px}
.cat small{color:var(--ink-3);font-size:12.5px;margin-top:-6px}

/* Fund cards */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:720px){.fgrid{grid-template-columns:1fr}}
.fcard{display:flex;flex-direction:column;gap:14px;padding:16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s;animation:viewin .25s ease-out both}
.fcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.fcard .top{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:0 0 auto}
.fname{font-weight:600;font-size:15.5px;line-height:1.3}
.fmeta{font-size:12.5px;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:12px;border-top:1px dashed var(--line)}
.stats div{min-width:0}
.stats small{display:block;font-size:11.5px;color:var(--ink-3)}
.stats b{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.risk{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;margin-left:auto;align-self:flex-start}
.risk.r5,.risk.r4{color:var(--red);background:var(--red-soft)}
.risk.r0,.risk.r1,.risk.r2,.risk.r3{color:var(--amber);background:var(--amber-soft)}
.empty{padding:28px 16px;color:var(--ink-3);text-align:center;grid-column:1/-1}

/* Skeleton */
.skel{position:relative;overflow:hidden;background:var(--surface-2);border-radius:8px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--surface) 70%,transparent),transparent);animation:shimmer 1.1s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

/* Service + learn tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .ic{width:32px;height:32px;border-radius:9px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center}
.tile .ic svg{width:18px;height:18px}
.tile b{font-size:14px}
.tile small{font-size:12.5px;color:var(--ink-3)}
.learn{display:flex;flex-wrap:wrap;gap:8px}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--ink-2);transition:background .15s,border-color .15s}
.pillbtn:hover{border-color:var(--brand);color:var(--brand-strong);background:var(--brand-soft)}
.note{font-size:12.5px;color:var(--ink-3);margin-top:22px}

/* ---------- Fund page ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-2);background:none;border:0;padding:4px 0;margin-bottom:10px}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.fhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.fhead .avatar{width:56px;height:56px;border-radius:14px;font-size:17px}
.fhead h1{font-size:24px;margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tagc{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.fbody{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:20px}
@media (max-width:860px){.fbody{grid-template-columns:1fr}}
.pane{padding:16px}
.pane h3{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.kv>div{padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.kv>div:nth-child(odd){padding-right:12px}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.kv small{display:block;font-size:12.5px;color:var(--ink-3)}
.kv b{display:block;font-size:16px;font-weight:600;overflow-wrap:anywhere;transition:opacity .15s}
.kv a{font-size:12px}
.kv .wide{grid-column:1/-1;padding-right:0}
.gauge{display:flex;flex-direction:column;align-items:center;gap:4px}
.gauge svg{width:100%;max-width:260px}
.needle{transform-origin:100px 100px;transition:transform .9s cubic-bezier(.2,.9,.25,1.15)}
.gauge .lvl{font-weight:700;font-size:18px}
.gauge small{color:var(--ink-3);font-size:12.5px;text-align:center}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.docs a{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.docs li:last-child a{border-bottom:0}
.docs a:hover{color:var(--brand-strong);text-decoration:none}
.docs svg{width:18px;height:18px;flex:0 0 auto;color:var(--ink-3)}
.docs .arr{margin-left:auto;color:var(--ink-3)}
.faq{display:flex;flex-direction:column}
.faq button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;font-size:14px;font-weight:500}
.faq button:last-child{border-bottom:0}
.faq button:hover{color:var(--brand-strong)}
.faq svg{width:16px;height:16px;color:var(--ink-3);flex:0 0 auto}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14.5px;transition:transform .1s,background .15s}
.btn:hover{background:var(--brand-strong)} .btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px}

/* ---------- Assistant ---------- */
.assistant{position:sticky;top:76px;height:calc(100vh - 96px);min-height:520px;display:flex;flex-direction:column;overflow:hidden}
.a-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.bot-av{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand-strong);position:relative;flex:0 0 auto}
.bot-av svg{width:19px;height:19px}
.bot-av::after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#2fb36d;border:2px solid var(--surface)}
.a-title{font-weight:700;font-size:15px}
.a-sub{font-size:12px;color:var(--ink-3)}
.a-head .acts{margin-left:auto;display:flex;gap:6px}
.a-head .iconbtn{width:32px;height:32px}
.close-sheet{display:none}
.context{display:none;align-items:center;gap:8px;margin:10px 14px 0;padding:6px 6px 6px 10px;background:var(--brand-soft);color:var(--brand-strong);border-radius:9px;font-size:13px;font-weight:600;animation:pop .15s ease-out}
.context.on{display:flex}
.context button{margin-left:auto;background:none;border:0;color:inherit;width:24px;height:24px;border-radius:6px;font-size:16px;line-height:1}
.context button:hover{background:color-mix(in srgb,var(--brand) 18%,transparent)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.welcome{font-size:14px;color:var(--ink-2)}
.welcome b{color:var(--ink);display:block;font-size:15px;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid color-mix(in srgb,var(--brand) 55%,var(--line));color:var(--brand-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;text-align:left;transition:background .15s,transform .1s;animation:pop .2s ease-out both}
.chips button:hover{background:var(--brand-soft)} .chips button:active{transform:scale(.97)}
.me{align-self:flex-end;max-width:85%;background:var(--brand);color:var(--brand-ink);padding:9px 13px;border-radius:16px 16px 4px 16px;font-size:14.5px;animation:msgin .18s ease-out;overflow-wrap:anywhere}
.bot{align-self:flex-start;max-width:94%;background:var(--surface-2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:11px 13px;font-size:14.5px;animation:msgin .18s ease-out}
@keyframes msgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bot .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-bottom:6px}
.tag.factual{background:var(--brand-soft);color:var(--brand-strong)}
.tag.refusal{background:var(--red-soft);color:var(--red)}
.tag.clarification{background:var(--blue-soft);color:var(--blue)}
.tag.not_found{background:var(--amber-soft);color:var(--amber)}
.bot p{margin:0}
.caret{display:inline-block;width:2px;height:1em;background:var(--brand);vertical-align:-2px;margin-left:1px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.after{opacity:0;transform:translateY(3px);transition:opacity .2s,transform .2s}
.after.on{opacity:1;transform:none}
.srcchip{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13px;transition:border-color .15s}
.srcchip:hover{border-color:var(--brand)}
.srcchip svg{width:16px;height:16px;color:var(--ink-3);flex:0 0 auto}
.srcchip a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.meta .upd{font-size:11.5px;color:var(--ink-3)}
.mini-acts{display:flex;gap:2px;align-items:center}
.mini-acts button,.mini-acts a{background:none;border:0;padding:4px 7px;border-radius:6px;color:var(--ink-3);font-size:12px;font-weight:500}
.mini-acts button:hover,.mini-acts a:hover{background:var(--line);color:var(--ink);text-decoration:none}
.mini-acts button[aria-pressed="true"]{color:var(--brand-strong);background:var(--brand-soft)}
.mini-acts svg{width:14px;height:14px}
.think{align-self:flex-start;display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;font-size:13px;color:var(--ink-2);animation:msgin .15s ease-out}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--brand);animation:bounce .9s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.12s}.dots i:nth-child(3){animation-delay:.24s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}
.think .step{transition:opacity .15s}
.retry{margin-top:8px}
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;background:var(--surface)}
.inputrow{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 12px;transition:border-color .15s,box-shadow .15s}
.inputrow:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inputrow.warn{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.inputrow input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:8px 0;outline:none}
.send{width:38px;height:38px;border-radius:11px;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;transition:transform .1s,opacity .15s}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.4;cursor:not-allowed}
.send svg{width:18px;height:18px}
.hint{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-3);margin:7px 2px 0}
.hint .pii{color:var(--red);font-weight:600}
.count{white-space:nowrap}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Mobile: assistant as bottom sheet */
.fab{display:none}
.scrim{display:none}
@media (max-width:1080px){
  .assistant{position:fixed;left:0;right:0;bottom:0;top:auto;height:88vh;height:88dvh;border-radius:20px 20px 0 0;z-index:50;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);min-height:0;max-width:640px;margin:0 auto;box-shadow:var(--shadow-lg)}
  .assistant.open{transform:none}
  .assistant::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line)}
  .close-sheet{display:grid}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;align-items:center;gap:8px;background:var(--brand);color:var(--brand-ink);border:0;border-radius:999px;padding:13px 18px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:transform .15s}
  .fab:active{transform:scale(.96)}
  .fab svg{width:18px;height:18px}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.on{opacity:1;pointer-events:auto}

}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<header class="topbar">
  <div class="in">
    <a class="logo" href="#/" aria-label="Scheme Facts home"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Scheme Facts</a>
    <nav class="nav" aria-label="Main">
      <a href="#/" id="nav-explore" aria-current="page">Explore</a>
      <a href="#/services" id="nav-services">Statements &amp; help</a>
    </nav>
    <div class="search" id="search">
      <label class="box" for="q-funds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="sr">Search funds or ask a question</span>
        <input id="q-funds" type="search" placeholder="Search funds or ask a question" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results">
        <span class="kbd" aria-hidden="true">/</span></label>
      <div class="results" id="results" role="listbox"></div>
    </div>
    <button class="iconbtn theme" id="theme" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
  </div>
</header>

<div class="page">
  <main id="view" tabindex="-1"></main>

  <section class="card assistant" id="assistant" aria-label="Fund FAQ assistant">
    <div class="a-head">
      <div class="bot-av" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 3v4M9 12.5h.01M15 12.5h.01M9.5 16h5"/></svg></div>
      <div><div class="a-title">Fund FAQ assistant</div><div class="a-sub">22 official sources · verified 4 Nov 2026</div></div>
      <div class="acts">
        <button class="iconbtn" id="clear" title="Clear chat" aria-label="Clear chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        <button class="iconbtn close-sheet" id="close" aria-label="Close assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
    <div class="context" id="ctx"><span id="ctx-name"></span><button id="ctx-clear" aria-label="Stop asking about this fund">×</button></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <form class="composer" id="form" autocomplete="off">
      <div class="inputrow" id="inputrow">
        <label for="q" class="sr">Your question</label>
        <input id="q" maxlength="500" placeholder="Ask about expense ratio, exit load, SIP…" enterkeyhint="send">
        <button class="send" id="send" aria-label="Send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="hint"><span id="hint">Facts only. Never enter PAN, Aadhaar, account numbers or OTPs.</span><span class="count" id="count"></span></div>
    </form>
  </section>
</div>
<div class="scrim" id="scrim"></div>
<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v11H8l-4 4z"/></svg>Ask about funds</button>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
  const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const I = {
    doc: svg('<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>'),
    arrow: svg('<path d="M9 6l6 6-6 6"/>'),
    back: svg('<path d="M15 6l-6 6 6 6"/>'),
    ext: svg('<path d="M7 17L17 7M9 7h8v8"/>'),
    chat: svg('<path d="M4 5h16v11H8l-4 4z"/>'),
    copy: svg('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>'),
    up: svg('<path d="M7 11v9H4v-9zM7 11l4-8a2 2 0 012 2v4h6a2 2 0 012 2.3l-1.2 7A2 2 0 0117.8 20H7"/>'),
    down: svg('<path d="M17 13V4h3v9zM17 13l-4 8a2 2 0 01-2-2v-4H5a2 2 0 01-2-2.3l1.2-7A2 2 0 016.2 4H17"/>'),
    sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
    moon: svg('<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'),
    equity: svg('<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>'),
    debt: svg('<path d="M4 7h16v10H4z"/><circle cx="12" cy="12" r="2.5"/>'),
    tax: svg('<path d="M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7z"/><path d="M9 12l2 2 4-4"/>'),
    all: svg('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'),
    stmt: svg('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),
    cas: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 14h4"/>'),
    gains: svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
    folder: svg('<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>'),
  };

  const LABEL = { factual: 'Answer', refusal: "Can't advise", clarification: 'Need detail', not_found: 'Not in sources' };
  const FUND_STYLE = {
    'HDFC Large Cap Fund': { s: 'LC', bg: 'linear-gradient(135deg,#2f6fe4,#5b8def)' },
    'HDFC Flexi Cap Fund': { s: 'FC', bg: 'linear-gradient(135deg,#00a87e,#2fcf9f)' },
    'HDFC ELSS - Tax Saver Fund': { s: 'TS', bg: 'linear-gradient(135deg,#8b5cf6,#b08cfb)' },
    'HDFC Liquid Fund': { s: 'LQ', bg: 'linear-gradient(135deg,#e0912f,#f2b65c)' },
  };
  const RISK_LEVELS = ['Low', 'Low to Moderate', 'Moderate', 'Moderately High', 'High', 'Very High'];
  const RISK_COLORS = ['#2fb36d', '#8cc63f', '#e9c13b', '#f2994a', '#eb6a3c', '#d6453d'];
  const CATS = [
    { k: 'all', label: 'All funds', ic: 'all', color: '#5b8def' },
    { k: 'Equity', label: 'Equity', ic: 'equity', color: '#00a87e' },
    { k: 'Debt', label: 'Debt', ic: 'debt', color: '#e0912f' },
    { k: 'ELSS', label: 'Tax saver', ic: 'tax', color: '#8b5cf6' },
  ];
  const SERVICES = [
    { t: 'Account statement', d: 'Email, SMS or call routes', ic: 'stmt', q: 'How can I get an account statement?' },
    { t: 'Consolidated statement (CAS)', d: 'All folios in one statement', ic: 'cas', q: 'How do I get a CAS?' },
    { t: 'Capital gains statement', d: 'For filing your tax return', ic: 'gains', q: 'How can I get a capital gains statement?' },
    { t: 'Factsheets & documents', d: 'KIM, SID and monthly factsheet', ic: 'folder', q: 'Where can I download HDFC Mutual Fund factsheets?' },
  ];
  const LEARN = ['What is an expense ratio?', 'What is an exit load?', 'What is a lock-in period?', 'What is a riskometer?', 'What is a benchmark?'];
  const TOPIC_Q = {
    'Expense ratio': n => `What is the expense ratio of ${n}?`,
    'Exit load': n => `What is the exit load of ${n}?`,
    'Minimum SIP': n => `What is the minimum SIP for ${n}?`,
    'Lock-in': n => `Is there a lock-in for ${n}?`,
    'Riskometer': n => `What is the riskometer of ${n}?`,
    'Benchmark': n => `What is the benchmark of ${n}?`,
    'KIM document': n => `Where can I find the KIM for ${n}?`,
  };
  const PII = [
    [/\b[A-Z]{5}\d{4}[A-Z]\b/i, 'a PAN'], [/\b\d{4}\s?\d{4}\s?\d{4}\b/, 'an Aadhaar number'],
    [/[\w.+-]+@[\w-]+\.[\w.]+/, 'an email address'], [/(?:\+91[\s-]?)?\b[6-9]\d{9}\b/, 'a phone number'],
    [/\b(otp|one time password)\b/i, 'an OTP'], [/\b(folio|account)\s*(no\.?|number|#)?\s*:?\s*\d{5,}/i, 'an account or folio number'],
  ];

  let funds = [], filter = 'all', context = null, busy = false, plan = 'Direct';
  const cache = new Map();
  const asked = new Set();
  const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const riskIdx = r => RISK_LEVELS.findIndex(l => l.toLowerCase() === String(r || '').toLowerCase());
  const fact = (f, k) => (f.facts[k] && f.facts[k].value) || '—';
  const avatar = (f, cls) => { const st = FUND_STYLE[f.name] || { s: 'MF', bg: 'var(--brand)' }; const a = el('div', 'avatar' + (cls ? ' ' + cls : ''), st.s); a.style.background = st.bg; return a; };

  // ---------- Theme ----------
  const root = document.documentElement;
  function storedTheme() { try { return localStorage.getItem('sf-theme'); } catch (e) { return null; } }
  function isDark() { const t = root.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function paintThemeIcon() { $('#theme').innerHTML = isDark() ? I.sun : I.moon; }
  if (storedTheme()) root.dataset.theme = storedTheme();
  paintThemeIcon();
  $('#theme').onclick = () => { root.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('sf-theme', root.dataset.theme); } catch (e) {} paintThemeIcon(); };

  // ---------- Toast ----------
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1600); }

  // ---------- Warm-up: wake the serverless function before the first question ----------
  fetch('/api/ask', { method: 'GET', cache: 'no-store' }).catch(() => {});

  // ---------- Views ----------
  function skeletonCards() {
    const g = el('div', 'fgrid');
    for (let i = 0; i < 4; i++) {
      const c = el('div', 'fcard');
      c.innerHTML = '<div class="top"><div class="skel" style="width:44px;height:44px;border-radius:12px"></div><div style="flex:1"><div class="skel" style="height:14px;width:70%"></div><div class="skel" style="height:11px;width:40%;margin-top:8px"></div></div></div><div class="skel" style="height:34px"></div>';
      g.append(c);
    }
    return g;
  }

  function fundCard(f, i) {
    const c = el('button', 'fcard'); c.type = 'button'; c.style.animationDelay = (i * 40) + 'ms';
    const top = el('div', 'top');
    const mid = el('div'); mid.append(el('div', 'fname', f.name), el('div', 'fmeta', f.category.replace(' - ', ' · ')));
    const r = fact(f, 'Riskometer');
    top.append(avatar(f), mid, el('span', 'risk r' + riskIdx(r), r));
    const st = el('div', 'stats');
    [['Expense ratio', fact(f, 'Expense ratio (Direct)')], ['Min SIP', fact(f, 'Min SIP')], ['Lock-in', fact(f, 'Lock-in') === 'NA' ? 'None' : fact(f, 'Lock-in')]]
      .forEach(([k, v]) => { const d = el('div'); d.append(el('small', '', k), el('b', '', v)); st.append(d); });
    c.append(top, st);
    c.setAttribute('aria-label', f.name + ', open fund page');
    c.onclick = () => { location.hash = '#/fund/' + slug(f.name); };
    return c;
  }

  function renderExplore() {
    const v = el('div', 'view');
    v.innerHTML = '<h1>Mutual fund facts, straight from the source</h1><p class="sub">Key facts for four HDFC Mutual Fund schemes, read from official documents. Tap a fund for details or ask the assistant. Every value links to its source.</p>';
    const cats = el('div', 'cats'); cats.setAttribute('role', 'group'); cats.setAttribute('aria-label', 'Filter by category');
    CATS.forEach(cat => {
      const n = funds.filter(f => cat.k === 'all' || f.category.includes(cat.k)).length;
      const b = el('button', 'cat'); b.type = 'button'; b.setAttribute('aria-pressed', filter === cat.k);
      const ic = el('span', 'ic'); ic.innerHTML = I[cat.ic]; ic.style.color = cat.color; ic.style.background = `color-mix(in srgb, ${cat.color} 14%, transparent)`;
      b.append(ic, el('b', '', cat.label), el('small', '', funds.length ? `${n} fund${n === 1 ? '' : 's'}` : ' '));
      b.onclick = () => { filter = cat.k; render(); };
      cats.append(b);
    });
    v.append(cats);

    const sec = el('section', 'block');
    const head = el('div', 'sechead'); head.append(el('h2', '', 'Funds covered'), el('span', '', 'Direct & Regular plans'));
    sec.append(head);
    if (!funds.length) sec.append(skeletonCards());
    else {
      const g = el('div', 'fgrid');
      funds.filter(f => filter === 'all' || f.category.includes(filter)).forEach((f, i) => g.append(fundCard(f, i)));
      sec.append(g);
    }
    v.append(sec);
    v.append(servicesBlock(), learnBlock());
    v.append(el('p', 'note', 'Independent study prototype. Not affiliated with Groww or HDFC Mutual Fund, and no access to any investor account. NAV and returns are not shown; see the official factsheet for past performance.'));
    return v;
  }

  function servicesBlock() {
    const s = el('section', 'block'); s.id = 'services';
    s.append(el('h2', '', 'Statements & help'));
    const t = el('div', 'tiles');
    SERVICES.forEach(x => {
      const b = el('button', 'tile'); b.type = 'button';
      const ic = el('span', 'ic'); ic.innerHTML = I[x.ic];
      b.append(ic, el('b', '', x.t), el('small', '', x.d));
      b.onclick = () => { setContext(null); openSheet(); ask(x.q); };
      t.append(b);
    });
    s.append(t); return s;
  }

  function learnBlock() {
    const s = el('section', 'block');
    s.append(el('h2', '', 'Learn the terms'));
    const w = el('div', 'learn');
    LEARN.forEach(q => { const b = el('button', 'pillbtn', q); b.type = 'button'; b.onclick = () => { openSheet(); ask(q); }; w.append(b); });
    s.append(w); return s;
  }

  function gauge(level) {
    const idx = riskIdx(level);
    const wrap = el('div', 'gauge');
    const cx = 100, cy = 100, r = 78;
    const pt = t => [cx - r * Math.cos(t), cy - r * Math.sin(t)];
    let arcs = '';
    for (let i = 0; i < 6; i++) {
      const a0 = Math.PI * i / 6 + 0.02, a1 = Math.PI * (i + 1) / 6 - 0.02;
      const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
      const on = i === idx;
      arcs += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${RISK_COLORS[i]}" stroke-width="${on ? 20 : 15}" fill="none" opacity="${on ? 1 : .35}"/>`;
    }
    const angle = idx < 0 ? 0 : -90 + (idx + 0.5) * 30;
    wrap.innerHTML = `<svg viewBox="0 0 200 118" role="img" aria-label="Riskometer: ${level}">${arcs}
      <g class="needle" style="transform:rotate(-90deg)"><path d="M100 34 L104 100 L96 100 Z" fill="var(--ink)"/></g>
      <circle cx="100" cy="100" r="7" fill="var(--ink)"/><circle cx="100" cy="100" r="3" fill="var(--surface)"/></svg>`;
    const lvl = el('div', 'lvl', level); lvl.style.color = RISK_COLORS[idx] || 'var(--ink)';
    wrap.append(lvl, el('small', '', 'SEBI riskometer, as shown on the scheme page'));
    requestAnimationFrame(() => requestAnimationFrame(() => { const n = wrap.querySelector('.needle'); if (n) n.style.transform = `rotate(${angle}deg)`; }));
    return wrap;
  }

  function srcLink(f, k) {
    const v = f.facts[k]; if (!v) return el('span');
    const a = el('a', '', 'Source ↗'); a.href = v.source_url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.title = v.source_title; return a;
  }

  function renderFund(f) {
    const v = el('div', 'view');
    const back = el('button', 'back'); back.type = 'button'; back.innerHTML = I.back + 'All funds';
    back.onclick = () => { location.hash = '#/'; };
    v.append(back);

    const head = el('div', 'fhead');
    const t = el('div'); t.style.flex = '1'; t.style.minWidth = '220px';
    t.append(el('h1', '', f.name));
    const tags = el('div', 'tags');
    f.category.split(' - ').forEach(x => tags.append(el('span', 'tagc', x)));
    tags.append(el('span', 'tagc', 'Growth & IDCW options'));
    t.append(tags);
    const ask1 = el('button', 'btn'); ask1.type = 'button'; ask1.innerHTML = I.chat + 'Ask about this fund';
    ask1.onclick = () => { setContext(f.name); openSheet(); $('#q').focus(); };
    head.append(avatar(f), t, ask1);
    v.append(head);

    const body = el('div', 'fbody');
    // Key facts with plan toggle
    const kp = el('div', 'card pane');
    const h = el('h3'); h.append(document.createTextNode('Key facts'));
    const seg = el('div', 'seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'Plan');
    const kv = el('div', 'kv');
    function cell(k, val, link, wide) { const d = el('div', wide ? 'wide' : ''); d.append(el('small', '', k), el('b', '', val), link); kv.append(d); }
    function paint() {
      kv.innerHTML = '';
      cell(`Expense ratio (${plan})`, fact(f, `Expense ratio (${plan})`), srcLink(f, `Expense ratio (${plan})`));
      cell('Minimum SIP', fact(f, 'Min SIP'), srcLink(f, 'Min SIP'));
      cell('Lock-in', fact(f, 'Lock-in') === 'NA' ? 'None' : fact(f, 'Lock-in'), srcLink(f, 'Lock-in'));
      cell('Riskometer', fact(f, 'Riskometer'), srcLink(f, 'Riskometer'));
      cell('Exit load', fact(f, 'Exit load'), srcLink(f, 'Exit load'), true);
      cell('Benchmark', fact(f, 'Benchmark'), srcLink(f, 'Benchmark'), true);
      seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === plan));
    }
    ['Direct', 'Regular'].forEach(p => { const b = el('button', '', p); b.type = 'button'; b.dataset.p = p; b.onclick = () => { plan = p; paint(); }; seg.append(b); });
    h.append(seg); kp.append(h, kv); paint();
    kp.append(el('p', 'note', 'Verified from official sources on 4 Nov 2026. Expense ratios can change; check the scheme page for the latest.'));
    body.append(kp);

    const side = el('div'); side.style.display = 'flex'; side.style.flexDirection = 'column'; side.style.gap = '16px';
    const rp = el('div', 'card pane'); rp.append(el('h3', '', 'Risk level'), gauge(fact(f, 'Riskometer')));
    side.append(rp);
    const dp = el('div', 'card pane'); dp.append(el('h3', '', 'Official documents'));
    const ul = el('ul', 'docs');
    f.documents.forEach(d => { const li = el('li'); const a = el('a'); a.href = d.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.innerHTML = I.doc; a.append(document.createTextNode(d.title)); const ar = el('span', 'arr'); ar.innerHTML = I.ext; ar.firstChild.style.width = '15px'; a.append(ar); li.append(a); ul.append(li); });
    dp.append(ul); side.append(dp);
    body.append(side);
    v.append(body);

    const ab = el('div', 'card pane'); ab.style.marginTop = '16px';
    ab.append(el('h3', '', 'About this scheme'), el('p', '', f.description));
    ab.lastChild.style.margin = '0'; ab.lastChild.style.color = 'var(--ink-2)';
    v.append(ab);

    const fq = el('div', 'card pane'); fq.style.marginTop = '16px';
    fq.append(el('h3', '', 'Common questions'));
    const list = el('div', 'faq');
    Object.values(TOPIC_Q).forEach(fn => { const q = fn(f.name); const b = el('button'); b.type = 'button'; b.append(document.createTextNode(q)); const s = el('span'); s.innerHTML = I.arrow; b.append(s); b.onclick = () => { setContext(f.name); openSheet(); ask(q); }; list.append(b); });
    fq.append(list); v.append(fq);
    v.append(el('p', 'note', 'NAV and returns are not shown. This page states facts only and is not a recommendation.'));
    return v;
  }

  function render() {
    const view = $('#view');
    const m = location.hash.match(/^#\/fund\/([\w-]+)/);
    const f = m && funds.find(x => slug(x.name) === m[1]);
    $('#nav-explore').setAttribute('aria-current', !m && location.hash !== '#/services' ? 'page' : 'false');
    $('#nav-services').setAttribute('aria-current', location.hash === '#/services' ? 'page' : 'false');
    view.replaceChildren(f ? renderFund(f) : renderExplore());
    if (f && context !== f.name) setContext(f.name);
    if (location.hash === '#/services') requestAnimationFrame(() => { const s = $('#services'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  }
  let lastHash = location.hash;
  window.addEventListener('hashchange', () => {
    const toFund = /^#\/fund\//.test(location.hash) || /^#\/fund\//.test(lastHash);
    lastHash = location.hash; render();
    if (toFund) window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  });

  fetch('/api/schemes').then(r => r.json()).then(d => { funds = d.schemes || []; render(); buildResults(); })
    .catch(() => { const v = $('#view'); v.replaceChildren(el('div', 'card empty', "Couldn't load the fund list. Is the server running?")); });
  render();

  // ---------- Search / command bar ----------
  const qf = $('#q-funds'), results = $('#results');
  let sel = 0;
  function buildResults() {
    const term = qf.value.trim().toLowerCase();
    results.innerHTML = '';
    const items = [];
    funds.filter(f => !term || (f.name + ' ' + f.category).toLowerCase().includes(term)).forEach(f => items.push({ kind: 'fund', f }));
    if (term.length > 2) items.push({ kind: 'ask', q: qf.value.trim() });
    if (!items.length) items.push({ kind: 'none' });
    items.forEach((it, i) => {
      const b = el('button'); b.type = 'button'; b.setAttribute('role', 'option'); b.setAttribute('aria-selected', i === sel);
      if (it.kind === 'fund') {
        b.append(avatar(it.f, 'mini')); const d = el('div'); d.append(document.createTextNode(it.f.name), el('small', '', it.f.category)); b.append(d);
        b.onclick = () => { location.hash = '#/fund/' + slug(it.f.name); closeResults(); qf.value = ''; qf.blur(); };
      } else if (it.kind === 'ask') {
        const ic = el('span', 'avatar mini'); ic.style.background = 'var(--brand-soft)'; ic.style.color = 'var(--brand-strong)'; ic.innerHTML = I.chat; ic.firstChild.style.width = '15px';
        const d = el('div'); d.append(document.createTextNode('Ask the assistant'), el('small', '', '“' + it.q + '”')); b.append(ic, d);
        b.onclick = () => { const q = it.q; qf.value = ''; closeResults(); qf.blur(); openSheet(); ask(q); };
      } else { b.disabled = true; b.textContent = 'Only four HDFC Mutual Fund schemes are covered.'; }
      results.append(b);
    });
  }
  function openResults() { buildResults(); results.classList.add('on'); qf.setAttribute('aria-expanded', 'true'); }
  function closeResults() { results.classList.remove('on'); qf.setAttribute('aria-expanded', 'false'); sel = 0; }
  qf.addEventListener('focus', openResults);
  qf.addEventListener('input', () => { sel = 0; openResults(); });
  qf.addEventListener('keydown', e => {
    const opts = [...results.querySelectorAll('button:not([disabled])')];
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, opts.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); }
    else if (e.key === 'Enter') { e.preventDefault(); if (opts[sel]) opts[sel].click(); return; }
    else if (e.key === 'Escape') { closeResults(); qf.blur(); return; }
    else return;
    opts.forEach((o, i) => o.setAttribute('aria-selected', i === sel));
  });
  document.addEventListener('click', e => { if (!$('#search').contains(e.target)) closeResults(); });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); qf.focus(); }
    if (e.key === 'Escape') closeSheet();
  });

  // ---------- Assistant ----------
  const msgs = $('#msgs'), input = $('#q'), send = $('#send');
  let anchor = null; // the latest question bubble: long answers keep it in view instead of scrolling past the answer's start
  const scrollDown = () => {
    if (anchor && anchor.isConnected) {
      const top = msgs.scrollTop + anchor.getBoundingClientRect().top - msgs.getBoundingClientRect().top - 8;
      msgs.scrollTop = top; // the browser clamps this, so short answers simply end at the bottom
    } else msgs.scrollTop = msgs.scrollHeight;
  };

  function chipRow(list) {
    const row = el('div', 'chips followups');
    list.forEach((q, i) => { const b = el('button', '', q); b.type = 'button'; b.style.animationDelay = (i * 35) + 'ms'; b.onclick = () => ask(q); row.append(b); });
    return row;
  }
  function suggestionsFor(name) {
    if (!name) return ['What is the exit load for HDFC Liquid Fund?', 'What is the minimum SIP for HDFC ELSS - Tax Saver Fund?', 'How can I get a capital gains statement?', 'What is a riskometer?'];
    return Object.entries(TOPIC_Q).map(([, fn]) => fn(name)).filter(q => !asked.has(q.toLowerCase())).slice(0, 4);
  }
  function welcome() {
    msgs.innerHTML = '';
    const w = el('div', 'welcome'); w.innerHTML = '<b>Hi! What would you like to know?</b>Ask about expense ratio, exit load, minimum SIP, lock-in, riskometer, benchmark, documents or statements for the four funds covered. I answer from official documents only.';
    msgs.append(w, chipRow(suggestionsFor(context)));
  }
  function refreshChips() {
    const rows = msgs.querySelectorAll('.followups'); const last = rows[rows.length - 1];
    if (last && !last.nextElementSibling) last.replaceWith(chipRow(suggestionsFor(context)));
  }
  function setContext(name) {
    context = name;
    $('#ctx').classList.toggle('on', !!name);
    $('#ctx-name').textContent = name ? 'Asking about ' + name : '';
    if (!msgs.querySelector('.me')) welcome(); else refreshChips();
  }
  $('#ctx-clear').onclick = () => setContext(null);
  $('#clear').onclick = () => { asked.clear(); welcome(); toast('Chat cleared'); input.focus(); };

  // Stages mirror what the server does; they only advance while we wait and vanish as soon as the answer arrives.
  const STAGES = ['Reading your question', 'Searching 22 official sources', 'Checking the evidence', 'Writing a short answer'];
  function thinking() {
    const t = el('div', 'think'); t.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
    const s = el('span', 'step', STAGES[0]); t.append(s);
    const timers = [250, 700, 1300].map((ms, i) => setTimeout(() => { s.style.opacity = 0; setTimeout(() => { s.textContent = STAGES[i + 1]; s.style.opacity = 1; }, 120); }, ms));
    t.stop = () => timers.forEach(clearTimeout);
    return t;
  }

  function reveal(p, text, done) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const words = text.split(/(\s+)/);
    if (reduce || words.length < 4) { p.textContent = text; return done(); }
    const step = Math.max(4, Math.min(18, Math.floor(450 / words.length)));
    const caret = el('span', 'caret'); const txt = document.createTextNode(''); p.append(txt, caret);
    let i = 0;
    const tick = () => {
      const chunk = Math.max(1, Math.ceil(words.length / 40));
      txt.data += words.slice(i, i + chunk).join(''); i += chunk;
      if (i % 6 === 0) scrollDown();
      if (i < words.length) setTimeout(tick, step); else { caret.remove(); done(); }
    };
    tick();
  }

  function botBubble(r, q, animate) {
    const b = el('div', 'bot');
    const status = r.status || 'not_found';
    b.append(el('span', 'tag ' + status, r.category === 'PII_CONTAINING_QUERY' ? 'Privacy' : (LABEL[status] || 'Answer')));
    const p = el('p'); b.append(p);
    const after = el('div', 'after');
    if (r.source_url) {
      const s = el('div', 'srcchip'); s.innerHTML = I.doc;
      const a = el('a', '', r.source_title || 'Official source'); a.href = r.source_url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.title = r.source_title || '';
      s.append(a); after.append(s);
    }
    const meta = el('div', 'meta');
    meta.append(el('span', 'upd', r.last_updated || ''));
    const acts = el('div', 'mini-acts');
    if (r.error) {
      const retry = el('button', '', 'Try again'); retry.type = 'button'; retry.onclick = () => { b.remove(); ask(q, true); }; acts.append(retry);
    } else {
      if (r.scheme && r.scheme !== 'General' && funds.some(f => f.name === r.scheme) && !location.hash.includes(slug(r.scheme))) {
        const go = el('a', '', 'Fund page →'); go.href = '#/fund/' + slug(r.scheme); go.onclick = () => closeSheetIfMobile(); acts.append(go);
      }
      const copy = el('button'); copy.type = 'button'; copy.innerHTML = I.copy; copy.title = 'Copy answer'; copy.setAttribute('aria-label', 'Copy answer');
      copy.onclick = async () => { try { await navigator.clipboard.writeText(r.answer + (r.source_url ? '\nSource: ' + r.source_url : '')); toast('Answer copied'); } catch (e) { toast("Couldn't copy"); } };
      const up = el('button'), down = el('button'); up.innerHTML = I.up; down.innerHTML = I.down;
      [up, down].forEach(x => { x.type = 'button'; x.setAttribute('aria-label', x === up ? 'Helpful' : 'Not helpful'); x.onclick = () => { up.setAttribute('aria-pressed', x === up); down.setAttribute('aria-pressed', x === down); toast('Thanks for the feedback'); }; });
      acts.append(copy, up, down);
    }
    meta.append(acts); after.append(meta); b.append(after);
    const text = r.answer || r.error || 'Something went wrong.';
    const finish = () => { after.classList.add('on'); scrollDown(); };
    if (animate) requestAnimationFrame(() => reveal(p, text, finish)); else { p.textContent = text; finish(); }
    return b;
  }

  async function ask(q, isRetry) {
    q = (q || '').trim();
    if (!q || busy) return;
    const pii = PII.find(([re]) => re.test(q));
    if (pii) { showPii(pii[1]); return; }
    busy = true; send.disabled = true;
    msgs.querySelectorAll('.followups').forEach(x => x.remove());
    if (!isRetry) { anchor = el('div', 'me', q); msgs.append(anchor); }
    asked.add(q.toLowerCase());
    const key = q.toLowerCase() + '|' + (context || '');
    const t = thinking(); msgs.append(t); scrollDown();
    let data, fromCache = cache.has(key);
    try {
      if (fromCache) data = cache.get(key);
      else {
        const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 20000);
        const res = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q, context_scheme: context }), signal: ctrl.signal });
        clearTimeout(to);
        data = await res.json();
        if (res.ok && !data.error) cache.set(key, data);
      }
    } catch (e) {
      data = { status: 'not_found', error: e.name === 'AbortError' ? 'That took too long. Please try again.' : "I couldn't reach the server. Check your connection and try again." };
    }
    t.stop(); t.replaceWith(botBubble(data, q, !fromCache));
    if (data.scheme && data.scheme !== 'General' && data.scheme !== context && funds.some(f => f.name === data.scheme)) {
      context = data.scheme; $('#ctx').classList.add('on'); $('#ctx-name').textContent = 'Asking about ' + data.scheme;
    }
    if (!data.error) msgs.append(chipRow(suggestionsFor(context)));
    busy = false; updateInput(); scrollDown();
    if (!matchMedia('(max-width:1080px)').matches || $('#assistant').classList.contains('open')) input.focus({ preventScroll: true });
  }

  function showPii(what) {
    $('#inputrow').classList.add('warn');
    const h = $('#hint'); h.className = 'pii'; h.textContent = `This looks like ${what}. Remove it; it was not sent.`;
  }
  function updateInput() {
    const v = input.value; const n = v.length;
    send.disabled = busy || !v.trim();
    $('#count').textContent = n > 400 ? `${n}/500` : '';
    const pii = PII.find(([re]) => re.test(v));
    if (pii) showPii(pii[1]);
    else { $('#inputrow').classList.remove('warn'); const h = $('#hint'); h.className = ''; h.textContent = 'Facts only. Never enter PAN, Aadhaar, account numbers or OTPs.'; }
    if (pii) send.disabled = true;
  }
  input.addEventListener('input', updateInput);
  input.addEventListener('focus', () => fetch('/api/ask', { method: 'GET', cache: 'no-store' }).catch(() => {}), { once: true });
  $('#form').addEventListener('submit', e => { e.preventDefault(); const q = input.value.trim(); if (!q || busy) return; if (PII.some(([re]) => re.test(q))) return; input.value = ''; updateInput(); ask(q); });
  welcome();

  // ---------- Mobile sheet ----------
  function openSheet() { $('#assistant').classList.add('open'); $('#scrim').classList.add('on'); }
  function closeSheet() { $('#assistant').classList.remove('open'); $('#scrim').classList.remove('on'); }
  function closeSheetIfMobile() { if (matchMedia('(max-width:1080px)').matches) closeSheet(); }
  $('#fab').onclick = () => { openSheet(); setTimeout(() => input.focus(), 280); };
  $('#close').onclick = closeSheet; $('#scrim').onclick = closeSheet;
})();
</script>
</body>
</html>
